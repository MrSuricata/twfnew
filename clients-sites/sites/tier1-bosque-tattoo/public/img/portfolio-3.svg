  <text x="50%" y="94%" text-anchor="middle" fill="#c9a66b" font-family="Inter, sans-serif" font-size="14" letter-spacing="0.3em" opacity="0.7">ILUSTRATIVO · OLA Y LUNA</text>
</svg>
