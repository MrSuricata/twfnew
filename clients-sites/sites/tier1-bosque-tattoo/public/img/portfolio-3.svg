    <circle cx="430" cy="170" r="70" fill="#c9a66b" fill-opacity="0.15" stroke="#c9a66b"/>
    <circle cx="455" cy="155" r="55" fill="#11110e" stroke="none"/>
    <!-- olas estilo japonés -->
