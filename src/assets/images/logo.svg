<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="currentColor">
    <!-- Globe -->
    <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
    
    <!-- Vertical lines -->
    <ellipse cx="50" cy="50" rx="12" ry="30" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <ellipse cx="50" cy="50" rx="22" ry="30" fill="none" stroke="currentColor" stroke-width="1.5"/>
    
    <!-- Horizontal lines -->
    <line x1="20" y1="35" x2="80" y2="35" stroke="currentColor" stroke-width="1.5"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="currentColor" stroke-width="1.5"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="currentColor" stroke-width="1.5"/>
    
    <!-- Swoosh/orbit lines -->
    <path d="M 15 60 Q 30 30, 85 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 12 65 Q 28 33, 88 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Arrow/movement indicator at end of swoosh -->
    <path d="M 85 20 L 88 15 L 90 22 Z" fill="currentColor"/>
  </g>
</svg>
